<div class="cw-block-inspector telephony-in-ui" data-block-inspector-root data-node-id="{{ node_id }}" data-node-type="{{ node_type }}">
  <div class="inspector-selection">
    <div class="inspector-node-card"><div class="inspector-node-copy">
      <strong>{{ node_title }}</strong><span>OVH/Asterisk inbound calls</span>
    </div></div>
    <div class="inspector-tabs">
      <button class="inspector-tab {{ general_active }}" data-inspector-tab="general" type="button">General</button>
      <button class="inspector-tab {{ ports_active }}" data-inspector-tab="ports" type="button">Ports</button>
    </div>
  </div>
  <div class="inspector-view {{ general_hidden }}" data-inspector-panel-tab="general">
  </div>
  <div class="inspector-view {{ ports_hidden }}" data-inspector-panel-tab="ports">
    <div class="ports-editor-section"><span class="group-label">Inputs</span>{{ inputs_html }}</div>
    <div class="ports-editor-section"><span class="group-label">Outputs</span>{{ outputs_html }}</div>
  </div>
</div>
